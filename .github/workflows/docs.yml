# Assembles the documentation website and publishes it to https://convinterp.org.
# Code cells are frozen (execute.freeze in _quarto.yml): their results live in _freeze/, committed
# from local renders, so this workflow needs neither Julia nor Python. To re-execute a page, render
# it locally after changing its code and commit the updated _freeze/ entry.
name: Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:                 # a "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write                       # to publish to GitHub Pages
  id-token: write                    # to authenticate the publishing

concurrency:
  group: pages                       # one publication at a time; a newer push waits for the current one
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Render the website
        run: quarto render
      - name: Upload the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4